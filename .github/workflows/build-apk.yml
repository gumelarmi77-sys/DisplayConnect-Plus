# .github/workflows/build-apk.yml
name: Build Android APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest          # <‑‑ the runner

    steps:
      # 1️⃣ Checkout the repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2️⃣ Set up JDK 17 (required by the Android toolchain)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 3️⃣ Install the Android SDK components you actually need
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The three packages below exist in the current SDK repository.
          # Adjust the API level if you change `compileSdk` in the Gradle file.
          packages: |
            platform-tools               # adb, fastboot, …
            platforms;android-34         # compileSdk = 34 (your project uses 34)
            build-tools;34.0.0           # matches the compile SDK

      # 4️⃣ Make the Gradle wrapper executable (Linux runners need this)
      - name: Make Gradlew Executable
        run: chmod +x ./gradlew

      # 5️⃣ Build the debug APK
      - name: Build APK with Gradle
        run: ./gradlew assembleDebug --stacktrace

      # 6️⃣ Upload the generated APK as an artifact
      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DisplayConnectPlus-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
