# .github/workflows/build-apk.yml
name: Build Android APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest               # <‑‑ runner

    steps:
      # -------------------------------------------------------------
      # 1️⃣ Checkout the repository
      # -------------------------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4

      # -------------------------------------------------------------
      # 2️⃣ Set up JDK 17 (required by Android toolchain)
      # -------------------------------------------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # -------------------------------------------------------------
      # 3️⃣ Install ONLY the Android SDK components we really need
      # -------------------------------------------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # *** IMPORTANT ***
          # • Use **space‑separated** package IDs (or newline‑separated via a block)
          # • No commas, no comments (#), no stray characters
          # • Adjust the API level if you change compileSdk in your Gradle file
          packages: platform-tools platforms;android-34 build-tools;34.0.0

      # -------------------------------------------------------------
      # 4️⃣ Make Gradle wrapper executable (Linux runners need this)
      # -------------------------------------------------------------
      - name: Make Gradlew Executable
        run: chmod +x ./gradlew

      # -------------------------------------------------------------
      # 5️⃣ Build the debug APK
      # -------------------------------------------------------------
      - name: Build APK with Gradle
        run: ./gradlew assembleDebug --stacktrace

      # -------------------------------------------------------------
      # 6️⃣ Upload the generated APK as an artifact
      # -------------------------------------------------------------
      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DisplayConnectPlus-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
